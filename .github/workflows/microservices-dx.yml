name: Microservices DX
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:
permissions:
  contents: read
jobs:
  public-workspace:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 25
    env:
      GONEX_SMOKE_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
      GOWORK: 'off'
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - name: Catalog, generation diagnostics and real child lifecycle
        run: go test -race ./internal/workspace ./internal/devrunner ./internal/cli -run 'TestCatalog|TestResolve|TestCycles|TestClient|TestServiceFlags|TestDoctor|TestSupervise|TestPrefix' -count=2
      - name: Public install and exact mapped tutorial without replacements or workspace resolution
        run: go run ./internal/tooling/workspace
