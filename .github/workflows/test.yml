name: Go
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
  workflow_call:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        go: ['1.27.2', '1.27.x']
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    env:
      GIN_MODE: release
      GOFLAGS: -p=2
      GOWORK: 'off'
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version: ${{ matrix.go }}
          cache-dependency-path: |
            go.sum
            contracts/go.sum
            integration/rpc/go.sum
            examples/microservices/services/*/go.sum
      - name: Formatting
        shell: bash
        run: |
          files=$(gofmt -l .)
          if [ -n "$files" ]; then
            printf '%s\n' "$files"
            exit 1
          fi
      - run: go mod verify
      - run: go test ./...
      - run: go vet ./...
      - run: go build ./...
      - run: go -C contracts test ./...
      - run: go -C integration/rpc test ./...
      - run: go -C integration/rpc vet ./...
      - run: go -C integration/rpc build ./...
      - run: go -C examples/microservices/services/identity test ./...
      - run: go -C examples/microservices/services/orders test ./...
      - name: Workflow lint
        if: runner.os == 'Linux' && matrix.go == '1.27.2'
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7
      - name: PowerShell verification script
        if: runner.os == 'Windows' && matrix.go == '1.27.2'
        run: pwsh -File scripts/verify.ps1
      - run: go run ./cmd/gonex grpc check
      - run: go run ./cmd/gonex openapi validate --file tests/testdata/basic.openapi.json --against tests/testdata/releases/v0.1.0.openapi.json
      - name: Race detector
        if: runner.os == 'Linux'
        run: go test -race ./...
      - name: Paired performance budgets
        shell: bash
        run: |
          set -o pipefail
          go test ./tests -run '^$' -bench BenchmarkComparison -benchmem -benchtime=200ms -count=3 | tee benchmark.txt
          go run ./internal/tooling/benchcheck benchmark.txt
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6
        with:
          name: benchmark-${{ runner.os }}-${{ matrix.go }}
          path: benchmark.txt

  postgres:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: gonex
          POSTGRES_PASSWORD: disposable_test_only
          POSTGRES_DB: gonex_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U gonex -d gonex_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      GONEX_REQUIRE_POSTGRES: '1'
      GONEX_TEST_POSTGRES_DSN: postgres://gonex:disposable_test_only@127.0.0.1:5432/gonex_test?sslmode=disable
      GIN_MODE: release
      GOFLAGS: -p=2
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: go test -race ./tests -run '^Test(Postgres|DatabaseReliability|MigrationProcessesAndRecovery)' -count=3 -v

  consumer:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      GONEX_SMOKE_VERSION: ${{ github.event.pull_request.head.sha || github.sha }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16
        with:
          go-version-file: go.mod
      - run: go run ./internal/tooling/consumer
